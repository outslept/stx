name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check versions
        shell: bash
        run: |
          version=$(jq -er .version napi/package.json)
          rust_version=$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "stx") | .version')
          if [[ "$version" != "$rust_version" ]]; then
            printf '::error::npm version %s does not match Cargo version %s\n' "$version" "$rust_version"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf '::error::Expected release tag v%s, got %s\n' "$version" "$GITHUB_REF_NAME"
            exit 1
          fi
      - run: cargo fmt --check -p stx-napi
      - run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-targets --all-features

  native:
    name: Native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Build and test Node-API
        working-directory: napi
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
      - name: Build and test CLI
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          cargo build --locked --release --bin stx --target "$TARGET"
          executable=stx
          if [[ "$RUNNER_OS" == Windows ]]; then executable=stx.exe; fi
          "target/$TARGET/release/$executable" --version
          if [[ "$RELEASE" == true ]]; then
            tar -czf "stx-$TARGET.tar.gz" -C "target/$TARGET/release" "$executable"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.release
        with:
          name: bindings-${{ matrix.target }}
          path: |
            napi/*.node
            napi/index.js
            napi/index.d.ts
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: inputs.release
        with:
          name: cli-${{ matrix.target }}
          path: stx-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7
