doctest = false

[lints]
workspace = true

[dependencies]
napi = { version = "3.16.3", features = ["napi6", "serde-json"] }
napi-derive = "3.7.2"
serde_json = "1.0.154"
stx = { path = ".." }

[build-dependencies]
napi-build = "2.7.0"
