lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      '@outslept/stx':
        specifier: file:../napi
        version: file:../napi

packages:

  '@outslept/stx@file:../napi':
    resolution: {directory: ../napi, type: directory}
    engines: {node: '>=22.14.0'}
    hasBin: true

snapshots:

  '@outslept/stx@file:../napi': {}
